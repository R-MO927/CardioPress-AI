<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="buttonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ff174f"/>
<stop offset="45%" stop-color="#d5003d"/>
<stop offset="100%" stop-color="#08090d"/>
</linearGradient>

<linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="white" stop-opacity="0"/>
<stop offset="50%" stop-color="white" stop-opacity=".3"/>
<stop offset="100%" stop-color="white" stop-opacity="0"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="9" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<filter id="softGlow">
<feGaussianBlur stdDeviation="18"/>
</filter>

</defs>

<!-- Background Glow -->

<ellipse
cx="450"
cy="90"
rx="300"
ry="55"
fill="#ff174f"
opacity=".18"
filter="url(#softGlow)"
/>

<!-- Outer Glow -->

<rect
x="145"
y="35"
width="610"
height="110"
rx="55"
fill="none"
stroke="#ff174f"
stroke-width="7"
opacity=".55"
filter="url(#glow)"
/>

<!-- Main Button -->

<rect
x="145"
y="35"
width="610"
height="110"
rx="55"
fill="url(#buttonGradient)"
stroke="#ff174f"
stroke-width="2"
/>

<!-- Inner Border -->

<rect
x="154"
y="44"
width="592"
height="92"
rx="46"
fill="none"
stroke="white"
stroke-opacity=".12"
/>

<!-- Shine -->

<rect
x="170"
y="47"
width="560"
height="34"
rx="17"
fill="url(#shine)"
/>

<!-- Heart -->

<text
x="220"
y="108"
font-family="Arial"
font-size="42"
fill="white"
filter="url(#glow)">
♥
</text>

<!-- Text -->

<text
x="285"
y="101"
font-family="Arial"
font-size="30"
font-weight="800"
letter-spacing="2"
fill="white">
LIVE DEMO
</text>

<!-- Arrow -->

<text
x="625"
y="103"
font-family="Arial"
font-size="36"
font-weight="bold"
fill="white">
→
</text>

<!-- Subtitle -->

<text
x="450"
y="128"
text-anchor="middle"
font-family="Arial"
font-size="11"
letter-spacing="3"
fill="white"
fill-opacity=".55">
OPEN CARDIOPRESS AI
</text>

</svg>